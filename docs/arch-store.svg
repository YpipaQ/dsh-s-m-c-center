<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="统一外挂储存库布局">
  <title>统一外挂储存库布局</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="440" fill="#FFFFFF"/>

  <text x="30" y="32" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#085041">统一外挂储存库：谁住在里面，谁被刻意留在外面</text>

  <rect x="30" y="48" width="440" height="312" rx="14" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="50" y="72" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#085041">~/.dsh/S-M-C（插件拥有）</text>

  <rect x="50" y="88" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="68" y="110" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">skills/</text>
  <text x="68" y="130" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">技能正本 + index.json；SKILL.md 从不改写</text>

  <rect x="50" y="154" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="68" y="176" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">mcp.json</text>
  <text x="68" y="196" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">激活中的定义；凭证明文，请保持 0600</text>

  <rect x="50" y="220" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="68" y="242" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">mcp-archive.json</text>
  <text x="68" y="262" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">已归档定义；不连接、不公告、可移回</text>

  <rect x="50" y="286" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="68" y="308" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">cli.json</text>
  <text x="68" y="328" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">系统 CLI 注册表（gh / git / tencent-news-cli …）</text>

  <rect x="490" y="48" width="380" height="306" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="510" y="72" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">留在库外（dsh 自己扫）</text>

  <rect x="510" y="88" width="340" height="44" rx="8" fill="#FFFFFF" stroke="#888780"/>
  <text x="680" y="114" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A">~/.dsh/skills</text>

  <rect x="510" y="144" width="340" height="44" rx="8" fill="#FFFFFF" stroke="#888780"/>
  <text x="680" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A">~/.agents/skills</text>

  <text x="510" y="216" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">这两个目录由 dsh 扫描，插件只在其中</text>
  <text x="510" y="234" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">注入 / 移除联接，从不搬走它们</text>

  <rect x="510" y="250" width="340" height="90" rx="8" fill="#FFFFFF" stroke="#888780"/>
  <text x="526" y="272" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">联接（Windows junction / POSIX symlink）</text>
  <text x="526" y="292" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">~/.dsh/skills/&lt;slug&gt; → S-M-C/skills/&lt;slug&gt;</text>
  <text x="526" y="312" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">联接里存的是绝对路径</text>
  <text x="526" y="330" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#A32D2D">手动剪切储存库会让技能对 agent 全部消失</text>

  <path d="M490 300 H480 V116 H468" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="30" y="380" width="840" height="44" rx="8" fill="#FAEEDA" stroke="#EF9F27"/>
  <text x="50" y="406" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#854F0B">搬迁：设环境变量 DSH_STORE_ROOT=&lt;新路径&gt; 后重启 dsh —— 插件自己搬家并重建所有联接</text>
</svg>
