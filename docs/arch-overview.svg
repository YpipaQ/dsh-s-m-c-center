<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="插件挂载与双面架构">
  <title>挂载与双面架构</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="610" fill="#FFFFFF"/>

  <text x="30" y="32" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#0C447C">挂载方式：profile bundle patch + npm 包安装，不改动 dsh 源码</text>

  <rect x="30" y="48" width="840" height="56" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="50" y="72" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">DeepSeek Harness host 进程（web profile）</text>
  <text x="50" y="92" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">插件只是一个 npm 包，dsh 源码零改动</text>

  <path d="M450 104 V136" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="462" y="124" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">cordis.patch.yml（bundle patch）</text>

  <rect x="30" y="140" width="840" height="192" rx="14" fill="#E6F1FB" stroke="#85B7EB"/>
  <text x="50" y="164" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#0C447C">dsh-s-m-c-center 插件包（双面）</text>

  <rect x="50" y="176" width="396" height="140" rx="10" fill="#FFFFFF" stroke="#378ADD"/>
  <text x="68" y="198" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#0C447C">Host 半区 · lib/index.js（ESM, node）</text>
  <text x="68" y="222" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· settings 命名空间：dsh-s-m-c-center</text>
  <text x="68" y="242" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· /api/dsh-s-m-c-center/* 路由（仅 loopback）</text>
  <text x="68" y="262" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· systemPrompt.section 向每个 agent 公告</text>
  <text x="68" y="282" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· MCP 真连接 → 注册 mcp__&lt;server&gt;__&lt;tool&gt;</text>
  <text x="68" y="302" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· 技能引擎 / CLI 探测引擎</text>

  <rect x="466" y="176" width="384" height="140" rx="10" fill="#FFFFFF" stroke="#378ADD"/>
  <text x="484" y="198" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#0C447C">Client 半区 · lib/client.js（浏览器）</text>
  <text x="484" y="222" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· 设置页「Web UI 插件 → 工具管理」</text>
  <text x="484" y="242" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· 四个页签：技能 / MCP / CLI / 使用说明</text>
  <text x="484" y="262" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· react 为运行时外部依赖</text>
  <text x="484" y="282" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1F2937">· 只通过 /api 与 host 通信</text>

  <rect x="30" y="356" width="840" height="64" rx="10" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="50" y="380" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">dsh 扫描、agent 读取（插件不搬走它们）</text>
  <rect x="470" y="370" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#888780"/>
  <text x="565" y="392" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A">~/.dsh/skills</text>
  <rect x="680" y="370" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#888780"/>
  <text x="765" y="392" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#2C2C2A">~/.agents/skills</text>

  <path d="M450 420 V450" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="438" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">目录联接指向正本（启用即注入，不启用即移除）</text>

  <rect x="30" y="456" width="840" height="130" rx="14" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="50" y="480" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#085041">~/.dsh/S-M-C 统一外挂储存库</text>
  <text x="50" y="500" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">插件拥有的全部运行时数据</text>

  <rect x="50" y="510" width="189" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="66" y="532" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">skills/</text>
  <text x="66" y="552" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">技能正本 + index.json</text>

  <rect x="253" y="510" width="189" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="269" y="532" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">mcp.json</text>
  <text x="269" y="552" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">激活中的 MCP 定义</text>

  <rect x="456" y="510" width="189" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="472" y="532" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">mcp-archive.json</text>
  <text x="472" y="552" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">已归档（不连接）</text>

  <rect x="659" y="510" width="189" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="675" y="532" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">cli.json</text>
  <text x="675" y="552" font-family="'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">系统 CLI 注册表</text>
</svg>
